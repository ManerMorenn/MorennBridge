name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish the extension
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep -E '^version = ' blender_manifest.toml | sed -E 's/version = "(.*)"/\1/')"
          addon="$(grep -E '^__version__ = ' __init__.py | sed -E 's/__version__ = "(.*)"/\1/')"
          test "$tag" = "$manifest" || { echo "tag $tag does not match manifest version $manifest"; exit 1; }
          test "$tag" = "$addon" || { echo "tag $tag does not match add-on version $addon"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: morennbridge-extension
          path: dist

      - name: Write checksums and release notes
        run: |
          (cd dist && sha256sum ./*.zip > SHA256SUMS)
          awk -v heading="## ${GITHUB_REF_NAME#v}" 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' \
            CHANGELOG.md > release-notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          body_path: release-notes.md
