name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PACKAGING_BLENDER: "4.5.15"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.3 markdown==3.7 pymdown-extensions==12.3 pygments==2.19.1
      - run: ruff check .
      - run: ruff format --check .
      - name: Build the documentation site
        run: python dev/build_site.py --out /tmp/site

  test:
    name: Tests (${{ matrix.os }}, Blender ${{ matrix.blender }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        blender: ["4.5.0", "4.5.15", "5.0.1", "5.1.2", "5.2.3"]
        include:
          - { os: windows-latest, blender: "4.5.15" }
          - { os: windows-latest, blender: "5.2.3" }
          - { os: macos-latest, blender: "4.5.15" }
          - { os: macos-latest, blender: "5.2.3" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/setup-blender
        with:
          version: ${{ matrix.blender }}
      - name: Run the test suite
        shell: bash
        run: |
          "${{ steps.setup.outputs.executable }}" --version
          "${{ steps.setup.outputs.executable }}" -b --factory-startup --python tests/run_tests.py -- -v

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/setup-blender
        with:
          version: ${{ env.PACKAGING_BLENDER }}
      - run: pip install --target "$RUNNER_TEMP/coverage" coverage==7.17.0
      - name: Run the test suite with coverage
        env:
          MORENN_COVERAGE_LIB: ${{ runner.temp }}/coverage
        run: '"${{ steps.setup.outputs.executable }}" -b --factory-startup --python tests/run_tests.py'

  gui:
    name: GUI session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/setup-blender
        with:
          version: ${{ env.PACKAGING_BLENDER }}
      - run: sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
      - name: Run the GUI checks
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1400x900x24" \
            "${{ steps.setup.outputs.executable }}" --factory-startup --python tests/gui_session.py

  build:
    name: Build extension
    needs: [lint, test, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/setup-blender
        with:
          version: ${{ env.PACKAGING_BLENDER }}
      - name: Validate the manifest
        run: '"${{ steps.setup.outputs.executable }}" --command extension validate .'
      - name: Build the extension zip
        run: |
          mkdir -p dist
          "${{ steps.setup.outputs.executable }}" --command extension build --source-dir . --output-dir dist
          ls -l dist
      - name: Install the zip into a clean profile and use it
        env:
          BLENDER_USER_RESOURCES: ${{ runner.temp }}/clean-profile
        run: |
          "${{ steps.setup.outputs.executable }}" --command extension install-file -r user_default -e dist/*.zip
          "${{ steps.setup.outputs.executable }}" -b --python dev/ci/smoke_installed.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: morennbridge-extension
          path: dist/*.zip
          if-no-files-found: error

  passed:
    # Single required check for branch protection: skipped jobs count as passed there.
    name: CI passed
    if: always()
    needs: [lint, test, coverage, gui, build]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
