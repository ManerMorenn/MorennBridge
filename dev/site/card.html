<!doctype html>
<!-- Social preview and extension listing image. Open at 1280x640 or 1920x1080 and take a screenshot. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MorennBridge card</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @font-face { font-family: "IBM Plex Mono"; src: url("static/fonts/ibm-plex-mono-200.woff2") format("woff2"); font-weight: 200; }
    @font-face { font-family: "IBM Plex Mono"; src: url("static/fonts/ibm-plex-mono-300.woff2") format("woff2"); font-weight: 300; }
    html, body { height: 100%; overflow: hidden; }
    body { display: grid; grid-template-columns: 46% 54%; align-items: center; padding: 0 0 0 6vw; }
    .logo { width: 6vw; height: auto; margin: 0 0 3vw; border: 0; }
    h1 { font-size: 4.4vw; margin-bottom: 1.6vw; }
    p { font-family: var(--mono); font-weight: 300; font-size: 1.32vw; line-height: 1.7; letter-spacing: .12em; text-transform: uppercase; }
    .shot { width: 100%; margin: 0; border-radius: .4vw 0 0 .4vw; box-shadow: 0 0 6vw rgba(110, 168, 254, .08); }
  </style>
</head>
<body>
  <div>
    <img class="logo" src="static/logo.jpg" alt="">
    <h1>MorennBridge</h1>
    <p>Blender to Unreal Engine 5<br>One-click FBX interchange</p>
  </div>
  <img class="shot" src="../../docs/images/03_export_static_setup.png" alt="">
</body>
</html>
