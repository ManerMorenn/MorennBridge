<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{doc_title}}</title>
  <meta name="description" content="{{title}}. {{subtitle}}">
  <link rel="icon" href="{{prefix}}favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{prefix}}favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{prefix}}apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@200;300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{prefix}}style.css">
{{fonts}}</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <header class="chrome">
    <a class="wordmark" href="{{home}}" aria-label="MorennBridge home">
      <img src="{{prefix}}logo.jpg" alt="" width="36" height="36">
      <span>MorennBridge</span>
    </a>
    <nav class="menu" aria-label="Site">{{nav}}</nav>
    <div class="actions">
      <a class="btn" href="{{repo}}" rel="noopener" title="Source on GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>Source</span>
      </a>
      <a class="btn btn-star" href="{{repo}}/stargazers" rel="noopener" title="Star MorennBridge on GitHub" data-repo="{{repo_slug}}">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25zm0 2.445L6.615 5.5a.75.75 0 0 1-.564.41l-3.097.45 2.24 2.184a.75.75 0 0 1 .216.664l-.528 3.084 2.769-1.456a.75.75 0 0 1 .698 0l2.77 1.456-.53-3.084a.75.75 0 0 1 .216-.664l2.24-2.183-3.096-.45a.75.75 0 0 1-.564-.41L8 2.694z"/></svg>
        <span>Star</span>
        <span class="count" hidden></span>
      </a>
    </div>
  </header>

  <main class="page">
    <div class="layout">
      {{toc}}
      <article class="content">
        <p class="eyebrow">{{eyebrow}}</p>
        <h1>{{title}}</h1>
        {{subtitle_block}}
        {{content}}
      </article>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>MorennBridge is free software released under the GPL-3.0-or-later.</p>
      <p class="footer-links">
        <a href="{{repo}}" rel="noopener">Source</a>
        <a href="{{repo}}/releases" rel="noopener">Releases</a>
        <a href="{{repo}}/issues" rel="noopener">Issues</a>
        <a href="{{repo}}/blob/main/LICENSE" rel="noopener">License</a>
      </p>
      <p class="copyright">Maner Morenn</p>
    </div>
  </footer>
  <script>
    (function () {
      var el = document.querySelector(".btn-star");
      var out = el && el.querySelector(".count");
      if (!out) return;
      var key = "mb-stars:" + el.dataset.repo;
      var show = function (n) {
        out.textContent = n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);
        out.hidden = false;
      };
      try {
        var cached = JSON.parse(localStorage.getItem(key) || "null");
        if (cached && Date.now() - cached.t < 3600000) { show(cached.n); return; }
      } catch (e) {}
      fetch("https://api.github.com/repos/" + el.dataset.repo, { headers: { Accept: "application/vnd.github+json" } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || typeof d.stargazers_count !== "number") return;
          show(d.stargazers_count);
          try { localStorage.setItem(key, JSON.stringify({ n: d.stargazers_count, t: Date.now() })); } catch (e) {}
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
