[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["fbxpatch/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
  "E501",   # long lines are allowed up to the formatter's judgement
  "B007",   # unused loop variables are common in bpy iteration
  "B905",   # zip(strict=...) is not available on every target
  "UP007",  # keep Optional[...] style out of Blender property annotations
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]  # the version must exist before the submodules import it
"ops/__init__.py" = ["F401"]
"ui/__init__.py" = ["F401"]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/dev/*", "*/site/*", "*/dist/*", "*/_vendor/*"]

[tool.coverage.report]
fail_under = 85
skip_empty = true
